[project]
name = "foodease-website"
version = "0.1.0"
description = "Accessible FoodEase website and app-seat foundation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "foodease-contract==2.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
foodease-website = "foodease_website.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
foodease-contract = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
