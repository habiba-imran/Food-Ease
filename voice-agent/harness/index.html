<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodEase inspector harness v1</title>
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; color: #1a1a1a; background: #f6f3ee; }
    body { max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    h2 { font-size: 1rem; margin-top: 1.25rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; align-items: center; }
    button, input, select { font: inherit; padding: 0.45rem 0.75rem; }
    #state { font-weight: 600; }
    #captions, #events { min-height: 5rem; max-height: 14rem; overflow: auto; border: 1px solid #ccc; padding: 0.75rem; background: #fff; white-space: pre-wrap; font-size: 0.9rem; }
    .hint { color: #555; font-size: 0.9rem; }
    .interrupted { color: #8a1c1c; }
  </style>
</head>
<body>
  <h1>FoodEase inspector (Phase 7)</h1>
  <p class="hint">
    Manual GUI works anytime (MockApp :8765). Voice starts only after
    <strong>Start assistance</strong> (consent + agent dispatch via :8090).
    <strong>End assistance</strong> stops prompts; cart is preserved.
  </p>
  <p>Agent state: <span id="state">off/awaiting_consent</span></p>
  <div class="row">
    <button id="start" type="button">Start assistance</button>
    <button id="endAssist" type="button" disabled>End assistance</button>
    <button id="mute" type="button" disabled>Mute mic</button>
    <button id="leave" type="button" disabled>Leave</button>
  </div>
  <div class="row">
    <input id="typed" type="text" placeholder="Typed input…" style="flex:1" disabled aria-label="Typed input" />
    <button id="send" type="button" disabled>Send</button>
  </div>
  <h2>MockApp / GUI simulator</h2>
  <div class="row">
    <select id="navPage" aria-label="Navigate page">
      <option value="home">home</option>
      <option value="burgers">burgers</option>
      <option value="wraps">wraps</option>
      <option value="cart">cart</option>
    </select>
    <button id="navBtn" type="button">GUI navigate</button>
    <button id="faultDrop" type="button">Toggle drop_connection</button>
  </div>
  <h2>Captions</h2>
  <div id="captions" aria-live="polite"></div>
  <h2>Raw event log</h2>
  <div id="events" aria-live="off"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
