[project]
name = "foodease-agent"
version = "0.1.0"
description = "Standalone LiveKit voice agent for the FoodEase accessible food-ordering demo"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "foodease-contract==2.0.0",
    "cartesia>=4.2.0",
    "deepgram-sdk>=7.12.0",
    "google-genai>=2.27.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "livekit-agents[cartesia,deepgram,google,silero,turn-detector]~=1.8",
    "livekit-api>=1.2.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.1",
]

[project.scripts]
foodease-cli = "foodease_agent.cli:main"
foodease-worker = "foodease_agent.worker:main"

[dependency-groups]
dev = [
    "foodease-website==0.1.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pre-commit>=4.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
foodease-contract = { path = "../contracts", editable = true }
foodease-website = { path = "../website", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "mock_app", "../website/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/foodease_agent/adapters/mock_catalog.py" = ["E501"]
"src/foodease_agent/engine.py" = ["E501"]
"src/foodease_agent/controls.py" = ["E501"]
"src/foodease_agent/broker.py" = ["E501"]
"src/foodease_agent/planner.py" = ["E501"]
"src/foodease_agent/reference.py" = ["E501"]
"tests/test_phase4_engine.py" = ["E501"]
"tests/test_phase4_acceptance.py" = ["E501"]
"tests/test_phase5_voice.py" = ["E501"]
"tests/test_phase6_speech.py" = ["E501"]
"tests/test_phase6_dialogue.py" = ["E501"]
"src/foodease_agent/agent.py" = ["E501"]
"src/foodease_agent/session.py" = ["E501"]
"src/foodease_agent/worker.py" = ["E501"]
"src/foodease_agent/dialogue_planner.py" = ["E501"]
"tests/test_phase7.py" = ["E501"]
"tools/run_dialogue_suite.py" = ["E501"]
"tools/inject.py" = ["E501"]
"tools/speak_pronunciation_sheet.py" = ["E501"]
"mock_app/participant.py" = ["E501"]
"src/foodease_agent/adapters/livekit_rpc.py" = ["E501"]
"src/foodease_agent/events.py" = ["E501"]
"src/foodease_agent/product_state.py" = ["E501"]
"harness/token_server.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["../website/src", "../orchestration/tools"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
