[project]
name = "foodease-agent"
version = "0.1.0"
description = "Standalone LiveKit voice agent for the FoodEase accessible food-ordering demo"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cartesia>=4.2.0",
    "deepgram-sdk>=7.12.0",
    "google-genai>=2.27.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "livekit-agents[cartesia,deepgram,google]~=1.8",
    "livekit-api>=1.2.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pre-commit>=4.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/foodease_agent/adapters/mock_catalog.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
